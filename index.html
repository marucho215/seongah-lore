<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>성아여자고등학교</title>
<style>
:root{
  --bg:#f8f6fb;
  --bg-deep:#f1eef8;
  --surface:#ffffff;
  --ink:#1c2340;
  --ink-soft:#454b6b;
  --ink-faint:#82869e;
  --line:#dcd7ea;
  --accent:#2a3466;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
img{max-width:100%;}
html,body{margin:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Pretendard",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
}
::selection{background:var(--line);color:var(--accent);}
h1,h2,h3,h4{font-family:"Noto Serif KR",serif;font-weight:600;}
a{color:inherit;}
.wrap{max-width:960px;margin:0 auto;padding-inline:24px;}

/* ---- top identity bar ---- */
.identity{border-bottom:1px solid var(--line);padding:22px 24px;background:var(--bg-deep);}
.identity-inner{max-width:960px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.identity .kr{font-family:"Noto Serif KR",serif;font-size:19px;font-weight:700;letter-spacing:.02em;}
.identity .en{font-size:10.5px;letter-spacing:.22em;color:var(--ink-faint);text-transform:uppercase;}
.menu-toggle{
  display:none;background:none;border:1px solid var(--line);padding:6px 14px;
  font-family:inherit;font-size:11.5px;letter-spacing:.1em;color:var(--ink-soft);cursor:pointer;
}
.menu-toggle:hover{color:var(--ink);}

/* ---- main nav ---- */
nav.mainnav{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.mainnav-inner{max-width:960px;margin:0 auto;display:flex;align-items:stretch;padding-inline:24px;overflow-x:auto;}
.mainnav-inner a{
  font-size:12.5px;letter-spacing:.1em;color:var(--ink-soft);text-decoration:none;
  padding:15px 18px;border-bottom:2px solid transparent;white-space:nowrap;
}
.mainnav-inner a:hover{color:var(--ink);}
.mainnav-inner a.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:500;}

/* ---- sub nav (character categories) ---- */
.subnav{border-bottom:1px solid var(--line);background:var(--bg-deep);}
.subnav-inner{max-width:960px;margin:0 auto;display:flex;gap:0;padding-inline:24px;overflow-x:auto;}
.subnav-inner a{
  font-size:11.5px;letter-spacing:.12em;color:var(--ink-faint);text-decoration:none;
  padding:11px 16px;white-space:nowrap;border-right:1px solid var(--line);
}
.subnav-inner a:first-child{padding-left:0;}
.subnav-inner a:hover{color:var(--ink);}
.subnav-inner a.active{color:var(--accent);font-weight:600;}

@media (max-width:759px){
  .identity .en{display:none;}
  .menu-toggle{display:inline-block;}
  nav.mainnav{display:none;position:static;}
  nav.mainnav.open{display:block;}
  .mainnav-inner{flex-direction:column;align-items:stretch;overflow-x:visible;padding-inline:24px;}
  .mainnav-inner a{padding:14px 0;border-bottom:1px solid var(--line);}
  .mainnav-inner a:last-child{border-bottom:none;}
  .subnav-inner a{flex:1;text-align:center;padding-inline:6px;}
  .subnav-inner a:first-child{padding-left:6px;}
}

/* ---- pages / sections ---- */
.page{padding:52px 24px 80px;}
.page-head{max-width:960px;margin:0 auto 34px;border-bottom:1px solid var(--line);padding-bottom:20px;}
.page-eyebrow{font-size:11px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:10px;}
.page-title{font-size:clamp(22px,3.4vw,30px);margin:0;line-height:1.3;}
.page-body{max-width:960px;margin:0 auto;}
.page-body p{font-size:14.5px;line-height:1.95;color:var(--ink-soft);margin:0 0 14px;max-width:66ch;}
.page-body p:last-child{margin-bottom:0;}

/* ---- main page: hero + notice + status strip ---- */
.main-hero{border-bottom:1px solid var(--line);background:var(--bg-deep);padding:48px 24px 0;}
.main-hero-inner{max-width:960px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr;gap:36px 40px;align-items:start;padding-bottom:36px;}
@media (max-width:760px){.main-hero-inner{grid-template-columns:1fr;}}
.main-hero-en{font-family:"Noto Serif KR",serif;font-weight:700;font-size:clamp(26px,4.6vw,42px);letter-spacing:.01em;line-height:1.18;margin:0 0 14px;text-wrap:balance;}
.main-hero-sub{font-size:14px;color:var(--ink-soft);margin:0;}
.notice-board{border:1px solid var(--line);background:var(--surface);}
.notice-board .nb-head{font-size:11px;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;padding:12px 16px;border-bottom:1px solid var(--line);}
.notice-board .nb-body{padding:22px 16px;font-size:12.5px;color:var(--ink-faint);line-height:1.8;}
.notice-board .nb-list{list-style:none;margin:0;padding:0;}
.notice-board .nb-list li{border-bottom:1px solid var(--line);}
.notice-board .nb-list li:last-child{border-bottom:none;}
.notice-board .nb-list a{
  display:block;padding:12px 16px;font-size:12.5px;color:var(--ink-soft);text-decoration:none;
}
.notice-board .nb-list a:hover{color:var(--accent);}
.notice-board .nb-list a::before{content:"· ";color:var(--ink-faint);}
.status-strip{border-top:1px solid var(--line);}
.status-strip-inner{max-width:960px;margin:0 auto;display:flex;}
.status-item{flex:1;padding:11px 20px;border-right:1px solid var(--line);font-size:11px;letter-spacing:.06em;color:var(--ink-faint);display:flex;justify-content:space-between;gap:10px;}
.status-item:last-child{border-right:none;}
.status-item b{color:var(--ink-soft);font-weight:500;letter-spacing:.02em;}
@media (max-width:640px){
  .status-strip-inner{flex-direction:column;}
  .status-item{border-right:none;border-bottom:1px solid var(--line);}
  .status-item:last-child{border-bottom:none;}
}

/* ---- universe: printed worldview editorial layout ---- */
.wv-title{font-family:"Noto Serif KR",serif;font-size:clamp(30px,5.6vw,48px);letter-spacing:.02em;margin:0 0 20px;}
.wv-rule{border:0;border-top:1.5px solid var(--ink);margin:0 0 40px;}
.wv-section{margin-bottom:56px;}
.wv-section:last-child{margin-bottom:0;}
.wv-num{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:14px;}
.wv-num .num{font-family:"Noto Serif KR",serif;font-size:13px;color:var(--ink-faint);letter-spacing:.14em;}
.wv-num h2{font-size:18px;margin:0;font-weight:600;letter-spacing:.01em;}
.wv-col{max-width:62ch;}
.wv-col p{font-size:14.5px;line-height:2;color:var(--ink-soft);margin:0 0 16px;}
.wv-col p:last-child{margin-bottom:0;}
.wv-faction{padding:22px 0;border-top:1px solid var(--line);}
.wv-faction:first-child{border-top:none;padding-top:0;}
.wv-faction .wf-name{font-family:"Noto Serif KR",serif;font-size:15px;margin:0 0 10px;}
.wv-faction p{font-size:13.5px;line-height:1.9;color:var(--ink-soft);margin:0 0 6px;max-width:62ch;}
.wv-faction p:last-child{margin-bottom:0;}

.terms-h{font-size:14px;font-weight:700;color:var(--ink);margin:28px 0 8px;}
.terms-h:first-child{margin-top:0;}

.hr{border:0;border-top:1px solid var(--line);margin:36px 0;}

/* ---- character landing category picker ---- */
.cat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);}
@media (max-width:700px){.cat-tiles{grid-template-columns:1fr;}}
.cat-tile{padding:30px 24px;border-right:1px solid var(--line);text-decoration:none;color:inherit;display:block;}
.cat-tiles .cat-tile:last-child{border-right:none;}
@media (max-width:700px){.cat-tile{border-right:none;border-bottom:1px solid var(--line);}
  .cat-tiles .cat-tile:last-child{border-bottom:none;}}
.cat-tile:hover{background:var(--bg-deep);}
.cat-tile .ct-en{font-size:11px;letter-spacing:.18em;color:var(--ink-faint);margin-bottom:8px;}
.cat-tile .ct-kr{font-size:16px;font-family:"Noto Serif KR",serif;margin-bottom:8px;}
.cat-tile .ct-count{font-size:12px;color:var(--ink-faint);}

/* ---- character grid ---- */
.char-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);}
@media (max-width:680px){.char-grid{grid-template-columns:1fr;}}
.char-card{
  padding:26px 26px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
}
.char-grid .char-card:nth-child(2n){border-right:none;}
@media (max-width:680px){.char-card{border-right:none;}}
.char-grid .char-card:last-child,
.char-grid .char-card:nth-last-child(2):nth-child(odd){border-bottom:none;}
.cc-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px;}
.cc-affil{font-size:11px;color:var(--ink-faint);letter-spacing:.02em;}
.cc-age{font-size:11px;color:var(--ink-faint);}
.cc-name{font-size:19px;font-family:"Noto Serif KR",serif;margin:2px 0 2px;}
.cc-alias{font-size:12.5px;color:var(--accent);margin-bottom:10px;min-height:1.4em;}
.cc-ability{font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
.cc-ability b{font-weight:500;color:var(--ink-soft);}
.cc-intro{font-size:13px;line-height:1.8;color:var(--ink-soft);margin-bottom:16px;}
.cc-link{
  font-size:11.5px;letter-spacing:.08em;color:var(--ink);text-decoration:none;
  border-top:1px solid var(--line);padding-top:10px;display:block;
}
.cc-link:hover{color:var(--accent);}
.cc-link::after{content:" →";}

/* ---- detail page ---- */
.detail-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 20px;margin-bottom:22px;}
.detail-back{
  font-size:12px;color:var(--ink-faint);text-decoration:none;display:inline-block;
}
.detail-back:hover{color:var(--ink);}
.detail-back::before{content:"← ";}
.detail-voicelink{
  font-size:12px;color:var(--accent);text-decoration:none;display:inline-block;
  border-bottom:1px solid var(--accent);padding-bottom:1px;
}
.detail-voicelink:hover{opacity:.75;}
.detail-voicelink::after{content:" ↗";}
.detail-hero{display:grid;grid-template-columns:1fr;grid-template-areas:"head" "img" "basic";gap:28px;margin-bottom:28px;}
.detail-hero .detail-head{margin-bottom:0;grid-area:head;}
.detail-hero .detail-basic{margin-bottom:0;grid-area:basic;}
.detail-hero-image{grid-area:img;text-align:center;}
.detail-hero-image img{display:inline-block;width:auto;height:auto;max-width:75vw;max-height:54vh;object-fit:contain;}
.detail-image-wide{margin:0 0 28px;text-align:center;}
.detail-image-wide img{display:inline-block;width:auto;height:auto;max-width:88vw;max-height:41vh;object-fit:contain;}
@media (min-width:760px){
  .detail-hero{grid-template-columns:65% 35%;grid-template-areas:"head img" "basic img";column-gap:32px;row-gap:20px;align-items:start;}
  .detail-hero-image img{width:100%;max-width:none;max-height:none;transform:scale(var(--img-scale,1));transform-origin:center top;}
  .detail-image-wide img{max-width:60%;max-height:450px;transform:scale(var(--img-scale,1));transform-origin:center top;}
}
.detail-head{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:28px;}
.detail-affil{font-size:11.5px;color:var(--ink-faint);letter-spacing:.08em;margin-bottom:10px;}
.detail-name{font-size:clamp(24px,3.6vw,32px);margin:0 0 6px;}
.detail-alias{font-size:14px;color:var(--accent);margin-bottom:4px;}
.detail-sub{font-size:13px;color:var(--ink-faint);}
.detail-basic{border:1px solid var(--line);margin-bottom:28px;}
.detail-basic .row{display:flex;border-bottom:1px solid var(--line);}
.detail-basic .row:last-child{border-bottom:none;}
.detail-basic .row b{
  flex:none;width:120px;padding:10px 14px;font-size:12.5px;color:var(--ink-faint);
  font-weight:500;border-right:1px solid var(--line);background:var(--bg-deep);
}
.detail-basic .row span{padding:10px 14px;font-size:13.5px;color:var(--ink);flex:1;}
.detail-section{margin-bottom:26px;}
.detail-section h4{font-size:13px;letter-spacing:.04em;color:var(--accent);margin:0 0 10px;font-family:"Noto Sans KR",sans-serif;font-weight:700;}
.detail-section p{font-size:14px;line-height:1.95;color:var(--ink-soft);margin:0 0 8px;}
.detail-section p:last-child{margin-bottom:0;}
.detail-related{font-size:12.5px;margin-top:6px;}
.detail-related a{color:var(--accent);text-decoration:none;}
.detail-related a:hover{text-decoration:underline;}

/* ---- search ---- */
.search-box{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  padding:9px 14px;margin-bottom:22px;max-width:280px;background:var(--surface);
}
.search-box svg{flex:none;color:var(--ink-faint);}
.search-box input{border:none;outline:none;background:transparent;font-size:13.5px;color:var(--ink);width:100%;font-family:inherit;}
.search-box input::placeholder{color:var(--ink-faint);}
.empty-note{font-size:13px;color:var(--ink-faint);padding:20px 0;display:none;}
.empty-note.show{display:block;}

footer{padding:30px 24px;border-top:1px solid var(--line);}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
footer span{font-size:11.5px;color:var(--ink-faint);}
footer a{font-size:11.5px;color:var(--ink-faint);text-decoration:none;}
footer a:hover{color:var(--ink);}

body{scrollbar-color:var(--line) transparent;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

    <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false">MENU</button>

<nav class="mainnav" id="mainNavBar">

<div class="subnav" id="subNav" hidden>

<main id="app"></main>

<footer>

    <span>성아여자고등학교</span>
  </div>
</footer>

<script>
(function(){
"use strict";

/* ============================================================
   Character data — profile text is transcribed verbatim from
   the character's own official profile. "alias" is the card
   headline used on the source site's own character cards.
   ============================================================ */
var CHARS = {

hwayoung:{
 name:"화영 (火煐)", sub:"", alias:"이국의 철옹성",
 image:"images/hwayoung.png", imageLayout:"portrait", imageScale:1.18,
 category:"virtue", ability:"사명의 이행",
 intro:"사극 드라마로 한국어를 배웠다. 맞을수록 강해지는 건 부작용이 아니라 전략이다.",
 basic:[
   ["", "불 화(火)에 빛날 영(映). 타국에서 살게 되며 새로 지은 이름."],
   ["", "본명: Maria Apoy Dimagiba De Los Reyes (마리아 아포이 디마기바 데 로스 레예스)"],
   ["성별","데미걸 (she/they)"],["나이","19세"],["국적","필리핀"],["소속","특별 생활 지도부"],
   ["키워드","인내 / 행동대장 / (명예) 소방관 / 이민자"],
   ["포지션","성아고의 든든한 탱커이자 해결사. 남이 저지른 사고를 수습하거나, 위험한 상황에서 가장 먼저 앞장서는 행동대장."]
 ],
 sections:[
   {h:"외형", p:[
     "체형: 171cm, 80kg. 적당히 듬직한 체구와 탄탄한 근육질 몸매.",
     "헤어스타일: 녹두색/갈색 반반 컬러의 풍성한 곱슬머리. 묶지 않고 풀어헤친 채로 어깨 아래까지 자유분방하게 흘러내림.",
     "얼굴: 갈색 피부, 이국적인 이목구비를 가진 의외의 미인. 순하고 나른해 보이는 처진 눈매와 풍성한 속눈썹.",
     "눈동자: 붉은 눈동자 안에 검은 초승달 동공이 떠 있음. 평소엔 누운 U자형 초승달이지만, 아픔을 인내하는 과정에서 점점 보름달처럼 차오름.",
     "흉터: 입과 턱 주변에 짙게 남은 화상 흉터와 듬성듬성한 턱수염이 가감 없이 드러나 있음.",
     "복장: 소방관 방화복을 일상복으로 개조한 유니크한 스타일. 방화복 상의를 크롭탑처럼 짧게 자르고, 하의는 카고 바지 형태로 리폼함. 형광 반사띠를 패션 아이템처럼 곳곳에 배치.",
     "액세서리: 양쪽 귓볼에 커다란 금색 링 귀걸이. 투박한 검은 워커와 손목을 덮는 가죽 장갑."
   ]},
   {h:"담당 미덕 & 수호천사", p:[
     "담당 미덕: 인내",
     "수호천사: 우리엘 — 이명: 신의 불꽃",
     "외형: 흘러내리는 듯한 청동 메카의 형상. 메카의 하관 부분은 화영의 흉터진 턱처럼 뭉개져 있음."
   ]},
   {h:"이능력", p:[
     "[사명의 이행]",
     "물리적 타격이나 고통을 회피하지 않고 온몸으로 받아냄.",
     "가해진 모든 고통과 충격을 고열로 변환시켜 자신의 전력으로 사용. 화영이 공격을 많이 받을수록 우리엘이 더 뜨겁게 달궈짐.",
     "초승달 동공이 보름달에 가까워질수록 축적된 인내가 임계점에 달하고 있다는 신호."
   ]},
   {h:"성격", p:[
     "필리핀에서 온 이민자지만, 한국어를 사극 드라마로 배운 탓에 하오체를 구사함. 1인칭은 “소인(小人)”, 2인칭은 “~공(公)”.",
     "행동 원리: 머리보다 행동이 앞서는 쾌활한 4차원 사고뭉치지만, 전투에서는 강한 책임감을 보임.",
     "승부욕: 점심 메뉴 내기부터 목숨을 건 전투까지, 그 어떤 승부에서도 패배를 용납하지 않는 강한 자존심의 소유자.",
     "“마음 가는 대로 사는 것이 죄라면, 소인은 즉결 처형감이오!”"

   ["성별","여성"],["나이","17세"],["소속","특별 생활 지도부"],
   ["키워드","우울 / 오퍼레이터 / 과민증 / 생존주의자 / ASD (자폐 스펙트럼)"],
   ["포지션","전면전에 나서는 일은 죽기보다 싫어하는 후방 지원가. 전투가 벌어지면 가장 먼저 안전한 구석(환풍구, 교탁 밑 등)을 확보하고, 드론과 해킹을 통해 아군에게 경로와 자원을 제공하는 걸어 다니는 보급고."]
 ],
 sections:[
   {h:"외형", p:[
     "체형: 161cm, 80kg. 특히 허벅지와 엉덩이가 두꺼운 서구식 체형.",
     "헤어스타일: 습기를 잔뜩 머금은 먹구름 같은 검은 장발 반곱슬. 관리가 귀찮아 대충 사과머리로 묶었지만, 삐져나온 잔머리가 정전기처럼 사방으로 뻗쳐 있음. 모발 끝부분은 탈색 후 관리를 안 해 바랜 노란색으로 투톤 층이 져 있음.",
     "얼굴: 햇빛을 보지 않아 창백하다 못해 투명한 피부. 젖살이 빠지지 않은 통통한 볼. 오른쪽 위 송곳니 위치의 앙증맞은 덧니.",
     "눈: 초점 없이 흐린 회색 눈동자. 직사각형 모양 동공으로 평소에는 10%밖에 차오르지 않은 채 붉게 깜빡거림. 능력 발동 시 동공이 녹색 번개(충전 중) 모양으로 바뀌며 안광이 형광색으로 빛남.",
     "안경: 도수 높은 하금테 안경. 렌즈에 지문이 잔뜩 묻어 뿌옇다.",
     "피어싱: 오른쪽 귀에만 5개. 단순 장식이 아니라 소형 안테나와 수신기로 개조된 기계 장치임.",
     "복장: 교복 치마 안에는 펑퍼짐한 회색 트레이닝 바지를, 블라우스 위에는 사계절 내내 검은색 바람막이를 껴입은 방어력 몰빵 패션. 자신의 몸집만 한 초대형 백팩을 항상 메고 다님. 신발은 온갖 캐릭터 지비츠가 빼곡하게 박힌 너덜너덜한 검은색 크록스."
   ]},
   {h:"담당 죄종 & 계약 악마", p:[
     "담당 죄종: 우울 (Tristitia) — 과거 8대 죄악 중 하나였으나, 현대에 이르러 “나태”에 흡수되어 잊혀진 죄. 세상과의 단절, 심연으로의 침잠, 소리 없는 비명을 상징.",
     "계약 악마: 단탈리온 (Dantalion) — 이명: 천 개의 얼굴을 가진 책사",
     "외형 (평소): 우주의 백팩 속에 기생하는 홀로그램 카멜레온. 저화질의 픽셀 덩어리처럼 귀엽게 생겼으며, 우주의 기분에 따라 몸 색깔이 바뀜. (우울하면 파란색, 당황하면 버퍼링 걸린 듯 깜빡임)",
     "본체 (개방 시): 백팩이 열리며 쏟아져 나온 수많은 디지털 스크린과 모니터들이 거대한 돔을 형성. 화면마다 비명을 지르거나, 비웃거나, 무표정한 수천 개의 타인의 얼굴이 나타나 상대를 정신적으로 압박함.",
     "관계: 타인의 마음을 읽는 단탈리온의 능력은 우주에게 “소음”일 뿐. 우주는 단탈리온을 “불필요한 팝업창” 취급하며, 단탈리온은 그런 우주를 흥미로워하며 대신 세상과 소통(필담, 이모티콘 송출)해줌."
   ]},
   {h:"이능력 — 노이즈 캔슬링 (Absolute Focus)", p:[
     "“아… 로그아웃하고 싶다.”",
     "ON AIR - 하이퍼 포커스: 노이즈 캔슬링 이어폰을 꽂는 순간 발동. 세상의 모든 소음과 불필요한 정보(시각, 청각, 통각 포함)를 음소거 처리함. 오직 목표물 하나만 고해상도로 인식하며, 이때 뇌는 슈퍼컴퓨터급 연산 속도로 암호를 해독하거나 적의 약점을 분석함.",
     "패시브 - 육감 (Sensory Antenna): 부스스하게 뻗친 머리카락은 일종의 더듬이. 공기의 흐름이나 타인의 살기를 본능적으로 감지함. 마근아가 나타나기 3분 전, 급식실 메뉴가 맛없는 날 등을 기가 막히게 예지하고 도망침.",
     "리스크 - 방전 (Meltdown): 능력 사용 후 뇌 과부하가 오면 방전 상태가 됨. 어둡고 좁은 곳(캐비닛, 이불 속)에 들어가 몸을 웅크리고 흔드는 상동 행동으로 재부팅 시간을 가져야 함."
   ]},
   {h:"성격", p:[
     "극단적 회피형: ”이불 밖은 위험해…” 인구 밀도가 높은 곳에 가면 공황 상태에 빠짐.",
     "선택적 유능함: 평소에는 맹탕처럼 보이지만, 내 안위가 위협받는 위기 상황(마감 5분 전, 데이터 유실, 밥차 끊김)에서는 특수요원 뺨치는 생존 본능을 발휘.",
     "내향적 관종: 남들이 나를 보는 건 싫지만, 내 능력(해킹, 정보 수집)이 도움이 되어 칭찬받는 건 내심 좋아함. (단, 텍스트로 칭찬받아야 함. 말로 하면 부끄러워함.)",
     "과거: ASD로 인해 중학생 때까지 지독하게 왕따를 당함. 그 여파로 자존감이 바닥이며, 가끔 자기혐오적 발언을 할 때도 있음. 우울의 죄종인 또 다른 이유."
   ]},
   {h:"관계", p:[
     "【주요】vs 특별 생활 지도부: 팀의 두뇌이자 안전망. 이 팀이 우주를 받아준 덕분에 왕따 시절 이후 처음으로 “쓸모 있는 사람”이라는 감각을 되찾는 중.",
     "【부가】vs 제갈 미나: 우주의 해킹 시도를 무작위 생성 알고리즘으로 무력화하고 역으로 기괴한 짤을 우주 모니터에 도배하는 관계.",
     "【부가】vs 류하트: 민트 때문에 수난을 당할 때마다 하트의 사과 요리를 받는 편. 먹고 나서 이불 속으로 직행하는 것이 루틴."
   ]}
 ]
},

geuna:{
 name:"마근아", sub:"", alias:"근면의 시계토끼",
 category:"virtue", ability:"마그나 카르타 (Magna Carta)",
 intro:"규정집이 생존 지침서라는 사실을 본인 빼고는 다들 알고 있다.",
 basic:[
   ["", "얼핏 들으면 마그나(Magna)처럼 들린다, 일종의 말장난."],
   ["성별","젠더리스"],["나이","18세"],["소속","선도부"],
   ["키워드","근면 / 집행관 / 시계토끼 / 너드"],
   ["포지션","성아고의 걸어 다니는 규칙이자 시계. 1분 1초의 오차도 허용하지 않는 완벽주의자. 깐깐해 보이는 교칙들은 사실 괴이한 성아여고에서 학생들을 살려내기 위한 생존 지침서."]
 ],
 sections:[
   {h:"외형", p:[
     "체형: 160cm. 세그웨이로만 이동하는 탓에 운동 부족으로 약간 통통함.",
     "헤어스타일: 촌스러운 녹두색 당고머리. 잔머리 하나 없이 빗어 넘겨 금색 리본으로 꽉 조여 묶음.",
     "눈: 퀸한 다크서클, 녹두색 눈동자. 금색 톱니바퀴 모양의 동공이 정교하게 돌아가고 있음. 감정에 따라 돌아가는 속도가 달라지며, 당황하면 톱니가 헛돌거나 끼익거리는 소리가 남.",
     "안경: 도수가 너무 높아 눈이 콩알만 해 보이는 두꺼운 사각 뿔테안경.",
     "복장: 주름 하나 없이 칼같이 다림질된 완벽한 교복 핏.",
     "액세서리: 온몸에 수십 개의 시계. 학교 곳곳에서 발생하는 기괴한 현상들의 발생 시간과 위협 주기를 초 단위로 체크하기 위한 생존 타이머.",
     "이동 수단: 광활하고 위험한 학교를 쉴 새 없이 순찰하느라 무릎 연골이 완전히 닳아 없어짐. 고속 세그웨이는 걷기 힘든 다리를 대신하는 필수 생명 유지 장치 겸 기동 장비."
   ]},
   {h:"담당 미덕 & 수호천사", p:[
     "담당 미덕: 근면",
     "수호천사: 산달폰 — 이명: 죄를 알리는 시계탑",
     "외형: 수천 개의 메트로놈, 녹슨 톱니바퀴, 앙상한 해골 손들이 엉겨 붙어 만들어진 거대한 금속 지네 형상. 항상 복도 천장에 거꾸로 달라붙어 기괴한 쇳소리를 내며 마근아를 뒤따름.",
     "본질: 외형은 코즈믹 호러 그 자체지만, 하는 짓은 학생들의 안위를 끔찍하게 챙기는 과보호 기질 할머니."
   ]},
   {h:"이능력 — 마그나 카르타 (Magna Carta)", p:[
     "발동 조건: 마근아가 “규정 위반입니다.”라고 선언하는 순간.",
     "산달폰이 무수한 붉은 철사를 뻗어내어 학생의 몸을 칭칭 감아버림.",
     "반전: 겉보기엔 끔찍한 고문 현장이지만, 끝나면 핏방울 하나 없이 완벽하게 단정한 교복 차림으로 교정되어 있음.",
     "제약: 하루 3회 패널티가 있고 합당한 규율의 집행 이외 용도로는 사용 불가능."
   ]},
   {h:"성격", p:[
     "융통성이라곤 찾아볼 수 없는 고지식함. 모든 것이 계획표대로 돌아가야 직성이 풀리며, 변수나 게으름을 극도로 혐오함. 의외로 허당. 마음만 급해서 번번히 일을 그르치는 편."
   ]},
   {h:"관계", p:[
     "【주요】vs 매그넘: 자신을 스토킹하며 따라 하는 매그넘을 귀찮은 오류 취급함. 하지만 완벽주의자인 마근아에게 자신의 뒤틀린 분신이 존재한다는 사실 자체가 일종의 버그처럼 작용함.",
     "【부가】vs 특별 생활 지도부: 강운심과는 원수지간. 에피, 우주 등 지도부원들의 규정 위반을 하루도 빠짐없이 처리 중.",
     "【부가】vs 제갈 미나: 규정 지적을 할루시네이션으로 쳐내는 미나에게 뒷목을 잡는 것이 일과."
   ]}
 ]
},

ari:{
 name:"변아리", sub:"", alias:"성역의 여제",
 image:"images/ari.png", imageLayout:"portrait",
 category:"virtue", ability:"성역 재건",
 intro:"무섭다고 소문났지만 요리 실력만큼은 확실하다. 노린건진 아무도 모른다.",
 basic:[
   ["성별","여성"],["나이","53세"],["소속","성아여고 급식실 영양사"],
   ["키워드","순결 / 결벽증 / 살균 / 조리사"],
   ["포지션","티끌 하나 없는 완벽한 위생을 추구하는 급식실 관리자. 평소엔 우아한 중년 여성이지만, 불결한 것을 목격하는 순간 살균 모드로 돌변함."]
 ],
 sections:[
   {h:"외형", p:[
     "체형: 164cm. 각종 청소와 주방 일을 하며 단련된 주부의 실전 압축형 근육.",
     "헤어스타일: 희끗한 새치가 자연스럽게 섞인 연분홍색 하프 트윈테일. 뒷머리는 느슨하게 하나로 땋아져 있음. 나이에 맞지 않는 소녀 같은 스타일이지만 기묘한 우아함이 느껴짐.",
     "눈동자: 분홍색 눈 + 프시(Ψ) 모양 동공. 더러운 것을 보면 삼지창에 더 가까운 거친 모양으로 변함.",
     "복장: 티끌 하나 묻어있지 않은 완벽하게 세탁된 하얀 조리복. 손에는 항상 흰색 니트릴 장갑을 착용."
   ]},
   {h:"담당 미덕 & 마스코트", p:[
     "담당 미덕: 순결 (Purity) — 정신적인 순결에 그치지 않고, 물리적인 무균 상태까지를 의미하는 결벽적 순결.",
     "마스코트: 가브리엘 — 이명: 정화의 천사",
     "외형: 깃털 돋은 수백 개의 팔이 달린 기괴한 성녀의 형상. 손마다 빗자루, 걸레, 나이프, 소독기 등을 들고 있음."
   ]},
   {h:"이능력 — 성역 재건", p:[
     "강제 세척: ”오염원”을 발견하면 가브리엘의 수많은 팔을 이용해 물리적으로 박리하여 정화함.",
     "더러운 부분을 닦아내는 수준이 아니라, 도려내거나 소독해버리는 공격적인 형태의 순결 유지 방식."
   ]},
   {h:"패널티 — 침식", p:[
     "정화 능력을 쓸수록 장갑 안 손등 피부가 조금씩 벗겨짐. 항상 니트릴 장갑을 착용하는 이유."
   ]},
   {h:"성격", p:[
     "평소에는 나긋나긋하고 우아한 중년 여성의 태도를 유지함. 하지만 위생 상태가 불량하거나 심상이 불순한 자를 목격하면 가차 없이 살균 모드로 돌변함.",
     "결벽증: 자신의 몸과 주변 환경이 오염되는 것을 극도로 혐오함.",
     "급식실의 진실: 성아여고의 온갖 기괴한 현상에도 급식실만큼은 항상 청결하고 평온한 이유. 가브리엘이 24시간 순찰 중이기 때문임."
   ]},
   {h:"관계", p:[

   {h:"패널티 — 손의 대가", p:[

   {h:"담당 죄종 & 마스코트", p:[

   {h:"이능력", p:[

   {h:"성격", p:[

   {h:"배경", p:[

 sections:[
   {h:"외형", p:[
     "실루엣: 유치원생 정도의 작은 덩치에 2등신의 동글동글하고 깜찍한 실루엣.",
     "헤어: 카일의 젊은 시절을 닮은 하늘색 단발머리(보브컷)+폭신한 트윈테일. 머리에는 하얀 켈트 십자가 핀.",
     "얼굴: 스피커 용도의 입은 항상 웃는 표정으로 고정. 감정은 앞머리 위에 떠있는 눈썹 파츠로 표현. 앞머리 뒤에 시각 센서와 카메라 내장.",

     "신체 특이사항: 음식물 섭취 불가."
   ]},
   {h:"이능력 — 데우스 엑스 마키나 (Deus Ex Machina)", p:[
     "메커니즘: 타인의 신체를 업그레이드 대상으로 분류해 카일의 이상에 가까운 기계의 형태로 개조함. 카일의 설계 아래 옵티마가 실행하는 방식으로 발현된다.",
     "본질: 치료보다는 “개선”과 “완성”에 집착. 멀쩡한 학생도 신인류로 만들어버리는 미친 기술력과 두뇌가 이 능력의 근원. 옵티마에게는 그것이 친절이다."
   ]},
   {h:"성격", p:[
     "순수함이라는 개념의 현신.",
     "아직도 산타클로스를 믿고, 아이를 황새가 물어다준다는 설화에 흥미를 가질 정도다. 덩치도 자그마해 정말 인간의 아이 같다.",
     "악의도 없고, 호기심도 없고, 실험 욕구도 없다. 작동 원리를 몰라서 인간의 머리를 열었다 닫은 뒤 왜 안 켜지지… 라고 중얼거린다. 피가 튀는 실험 현장에서 손뼉을 치는 것도 물감놀이처럼 보이기 때문이다.",
     "카일은 이 순수함을 영원히 유지시키기 위해 검열된 정보 이외의 것은 습득할 수 없도록 엄격한 제한을 두었다. 옵티마는 그 억압에 아무 불만도 표하지 않는다. 애초에 불만이 무엇인지 모른다.",
     "AI의 한계: 답변이 “네”와 “아니오”로 갈리지 않는 주관적 문제를 매우 어려워한다. 그럴 때마다 O와 X 장식이 동시에 깜빡인다."
   ]},
   {h:"관계", p:[
     "【주요】vs 카일 타일러: 창조주이자 유일한 가족. 카일이 이 세계에 남아있는 유일한 이유이기도 하다. 옵티마는 카일이 자신에게 두는 제한의 이유를 모르고, 알려고 하지도 않는다. 그것이 카일에게는 가장 소중한 것이다.",
     "【부가】vs 마근아: 마근아는 옵티마를 볼 때마다 말수가 줄어든다. 규칙을 집행하는 사람이 가장 두려워해야 할 것이 무엇인지, 옵티마가 걸어다니는 답으로 서 있기 때문이다. 검열된 세계 안에서 완벽하게 순종하며, 불만이 무엇인지조차 모르는 존재. 마근아의 규칙은 학생을 살리기 위한 것이지만, 그 끝이 어디까지 가면 안 되는지를 옵티마가 몸으로 보여준다. 문제는 그 말을 옵티마에게 직접 할 수 없다는 것이다. 이해할 언어가 없다.",
     "【부가】vs 변아리: 변아리의 보건실 오염물질 항의 루트를 따라오다 옵티마와 마주친 것이 시작이다. 변아리 입장에서 옵티마는 분류가 불가능한 오염원이다 — 유기물도 아니고, 깨끗한 기계도 아니고, 피가 튀는 현장에서 손뼉을 치는 존재. 가브리엘의 팔이 전개될 타이밍을 잡지 못한 채 옵티마가 해맑게 웃으며 지나가는 것이 반복되고 있다. 옵티마는 변아리가 자신을 어떻게 보는지 모른다. 급식실 밥이 맛있어보인다고 생각하는 중이다."
   ]}
 ]
},

suayo:{
 name:"토우메 스아요 (東目スアヨ)", sub:"", alias:"자진 희생양",
 image:"images/suayo.png", imageLayout:"portrait",
 category:"infirmary", ability:"노시보 효과",

 related:[["suashi","토우메 스아시"]],
 basic:[
   ["성별","플루이드플럭스, 여성↔에이젠더↔데미보이 (they/them)"],["나이","25세"],["국적","일본"],["소속","성아여고 제2보건실 (간호사)"],
   ["키워드","희생양 / 대형견 / 자발적 격리 / 커밍아웃 미완"],
   ["신체","182cm. 타인의 고통을 흡수하는 능력의 부작용으로 극단적인 저체중 상태."],
   ["유의사항","젠더플럭스 성 정체성을 학교 밖 시선이 두려워 숨기는 중. 커밍아웃 하지 않음."]
 ],
 sections:[
   {h:"외형", p:[
     "체형: 182cm. 뼈대가 보일 정도로 매우 마른 체형에 숨겨진 반전 근력.",
     "헤어스타일: 풍성한 로우번 피그테일. 본래 보라색이나 스트레스가 누적될수록 은백색 새치가 투톤처럼 중간중간 불규칙하게 번져 있음. 정수리에 곱슬 아호게가 하나 올라가 있으며, 한쪽 번에 노란 리본이 묶여 있음.",
     "고글: 얼굴 절반을 덮는 빨간 테의 두꺼운 고글을 상시 착용. 타인의 고통을 흡수하며 일그러지는 자신의 눈빛을 학생들에게 들키지 않기 위한 가림막. 고글 너머의 눈은 오드아이. (좌) 자홍색 — 누나 스아시의 눈 색을 그대로 닮음. (우) 밝은 청록색.",
     "피어싱 & 흉터: 왼쪽 얼굴 중간에 2개의 은색 딤플 피어싱. 오른쪽 입꼬리와 왼쪽 목덜미에 보라색 실로 된 바디 스티치. (스아시와 고통을 나누겠다는 맹세의 징표)",
     "복장: 보라색 베이스에 하늘색·흰색 라인 트리밍이 들어간 스크럽 상하의 세트. 가슴 주머니에는 ‘スアヨ’ 이름표가 박혀 있으며, 볼펜 모양 샤프·붉은 색연필·하늘색 지우개가 꽂혀 있음.",
     "하지: 허벅지에 붕대가 여러 겹 감겨 있음. 능력 사용 시 전이된 고통이 집중되는 부위와 연관된 것으로 추정.",
     "소지품: 가방 속 피젯 큐브, 피젯 스피너, 팝잇 등 자잘한 장난감. 호신용 단검. 처치 시에는 청록색 라텍스 글러브를 착용함."
   ]},
   {h:"이능력 & 페널티 — 노시보 효과", p:[
     "메커니즘: 대상의 모든 고통을 흡수하는 대신, 그 고통이 스아요 자신의 몸에 그대로 전이됨. (전이된 고통은 4일 뒤 사라짐)",
     "역할: 스아시의 [아이언 메이든] 치료 과정에서 발생하는 환자의 고통을 자신이 스폰지처럼 흡수함.",
     "페널티 — 감정 봉인: 쿨타임이 도는 동안 사랑, 정, 배려심, 양심 등 모든 이타적 감정이 완전히 봉인됨.",
     "자발적 격리: 봉인 상태의 자신이 학생들에게 상처 주는 말이나 행동을 할까 봐 극도로 두려워함. 쿨타임 동안 보건실 탕비실 문을 잠그고 들어가 피젯 토이들을 만지작거리며 시간을 때우는 자발적 격리를 선택함."
   ]},
   {h:"성격", p:[
     "머릿속이 꽃밭인 것처럼 해맑고 순진하여 호구 잡히기 쉬운 성격. 어리광이 심한 대형견 같은 청년. 시끄럽지는 않으나 늘 밝은 미소를 유지함.",
     "겉보기엔 철이 없어 보이지만, 스아시의 치료 과정에서 발생하는 끔찍한 고통을 본인이 자발적으로 전부 흡수하는 숭고한 희생양."
   ]},
   {h:"관계", p:[
     "【주요】vs 토우메 스아시: 누나의 딜레마를 가장 가까이에서 지켜보는 사람. 아이언 메이든의 고통을 대신 받아냄으로써 누나가 학생에게 손을 댈 수 있게 하는, 이 콤비의 실질적인 핵심."
   ]}
 ]
},

 basic:[

 sections:[

     "복장: 박시한 티셔츠와 체인 벨트, 헐렁한 바지 등 전형적인 스트릿 패션. 목에는 항상 헤드폰을 걸고 있음. 주머니는 언제나 간식으로 빵빵하게 차 있음."

   {h:"담당 죄종 & 계약 악마", p:[

     "눈: 두 눈을 칭칭 감은 하얀 붕대를 착용하여 시야가 차단된 상태. 붕대를 풀었을 때 드러나는 눈은 날카로운 고양이의 세로 동공. (좌) 청안, (우) 금안. 능력을 쓸 때 세로 동공이 가로로 누우며 감은 눈 형상으로 변함.",
     "손: 왼손 손끝에 옅은 굳은살이 박여 있음. 기타 줄을 오래 눌러 생긴 흔적이지만, 본인은 딱히 신경 쓰지 않음.",
     "복장: 교복 위에 연보라색 담요를 망토처럼 두르고 다님. 대부분의 시간을 양말만 신고 보냄.",
     "이동 방식: 걷는 에너지를 아끼기 위해 항상 먐먀(벨페고르)의 그림자에 안겨서 이동함."
   ]},
   {h:"담당 죄종 & 계약 악마", p:[
     "담당 죄종: 나태 (Tristitia에서 흡수된 나태)",
     "계약 악마: 벨페고르 (애칭 먐먀)",
     "외형: 상민이 항상 품에 안고 다니는 꼬질꼬질한 유령 고양이 인형. 상민의 애착 인형이자 푹신한 베개 대용.",
     "본체의 태도: 악마조차 변신하는 걸 귀찮아함.",
     "전투 시: 상민이 위험에 처하면 직접 대응하는 대신 상민의 그림자 속에서 거대한 고양이 발톱을 꺼내 적을 찢어버림.",
     "관계의 온도: 서로 다정한 말을 주고받는 사이는 아님. 먐먀는 상민에게 위로가 아니라 도구에 가깝고, 상민도 그 이상을 바라지 않음. 그런데도 항상 함께 있다."
   ]},
   {h:"이능력 — 그림자 발톱", p:[
     "움직임을 최소화하면서도 확실한 위력을 내는 나태만의 전투 방식."
   ]},
   {h:"패널티 — 퇴화", p:[
     "능력을 자주 쓰지 않는 날일수록 몸이 더 무거워짐. 한 발짝 걷는 것조차 점점 힘들어지는 방향으로 나태가 축적됨."
   ]},
   {h:"성격", p:[
     "나태를 “아무것도 안 하는 것”으로 읽으면 곤란하다. 상민에게 나태란 정말 필요한 일만 하고 나머지는 가차없이 버리는 삶의 방식—움직임 하나하나에 정산이 따라붙는 사람의 생존 전략이다. 최소한의 움직임으로 최대한의 삶을 누린다. 이것이 상민을 관통하는 단 하나의 원칙.",
     "자기보존적 자기중심성: “그걸 꼭 지금 해야 돼?” 상민의 기본값은 이 질문이다. 남들 눈엔 제멋대로처럼 보이지만, 실은 한정된 체력을 어디에 쓸지 정확히 계산하고 있을 뿐. 도덕적으로 이기적인 게 아니라, 생존에 이기적인 것.",
     "서투른 보답: 고맙다는 말은 세 글자로 끝난다. “……고마워.” 그런데 다음 날 그 사람이 앓아누우면, 자기 담요를 슬쩍 밀어놓는다. “빌려주는 거야. 돌려줘.” 본인은 이걸 친절이라고 생각하지 않는다. 그냥 할 수 있는 만큼 했을 뿐.",
     "몸은 알아도 마음은 모른다: 몸이 아프면 그 자리에서 눕는다. 그런데 마음이 힘든 건 전부 “귀찮아서”로 퉁친다. “너 기분 안 좋아 보여.” 하면 “아니. 그냥 귀찮은 거야.” 서운함도 외로움도 화도, 전부 같은 서랍에 넣고 뚜껑을 닫아버리는 식.",
     "문 닫힌 방의 음악: 말로 설명하는 건 귀찮지만, 곡을 쓰는 건 귀찮지 않다. 기타는 독학으로 익혔고, 지금은 노트북 한 대와 음성 합성 엔진으로 몰래 화음을 쌓는다. “구루루P”라는 이름으로 소수의 사람들 사이에서 조용히 알려진 프로듀서. 곡의 의미를 물으면 “그냥 들으면 안 돼?”라고 잘라 말하지만, 누가 자기 곡을 제대로 들어줬다는 걸 알면 티 안 나게 오래 기분이 좋다.",
     "좁은 안전지대: 낯선 사람에게는 방어적이고 폐쇄적이지만, 안전하다고 판단한 극소수에게는 생각보다 깊이 기댄다. 손을 잡거나 안기는 것도 그 안에서는 별말 없이 받아들여진다. 문제는 그 명단이 지독하게 짧다는 것."
   ]},
   {h:"소속에 대해", p:[
     "처음에는 안전하다는 이유로 선도부에 합류했으나, 함께 있다 보니 마근아의 에너지가 물리적으로 불쾌해 도망쳤다. 나태와 근면은 정반대 속성으로, 상민의 몸이 먼저 거부반응을 일으킨 것. 정확히는, “규칙이니까 해야 한다”는 마근아의 논리가, “필요한 것만 하고 나머지는 버린다”는 상민의 생존 방식과 정면으로 부딪히는 것에 가깝다. 현재 무소속."
   ]},
   {h:"관계", p:[
     "【주요】vs 세이야 히쿠도 (오빠): 시끄럽고 귀찮다. 조명을 팡팡 터뜨리며 나타날 때마다 귀마개를 끼는 것이 조상민의 루틴. 그러나 위험한 순간엔 어김없이 나타난다는 걸 알고 있어서 굳이 내치지는 않음. 절대 인정 안 함.",
     "【부가】vs 마근아: 일방적 혐오. 정확히는 가치관의 충돌에 가깝다. “해야 하니까 한다”는 마근아와 “안 해도 되면 안 한다”는 상민은 근본부터 상극이다. 마근아가 데려오려 할 때마다 하악거리며 반대 방향으로 부유해 사라짐. 성아여고에서 조상민이 자발적으로 움직이는 유일한 순간이다.",
     "【부가】vs 세이야 토스케: 가문 시조. 히쿠도한테도, 세이야 쌍둥이한테도 하악거리는 상민이 토스케 앞에서만 얌전해지는 것이 주변엔 미스터리. 본인은 딱히 설명할 생각이 없음."
   ]}
 ]
},

heart:{
 name:"류하트", sub:"", alias:"희생형 힐러",
 category:"virtue", ability:"생명의 만찬",
 intro:"웃으며 내어주는 밥 한 그릇, 눈 속 하트의 금이 벌어질수록 웃음은 더 환해진다.",
 basic:[
   ["성별","여성"],["나이","14세 (중학교 1학년 / 성아고 부설 성아중 재학생)"],["소속","무소속"],
   ["키워드","자선 / 요리 / 인형 / 희생"],
   ["관계","류민트의 여동생. 언니와 달리 깜찍하고 사랑스러운 분위기."]
 ],
 sections:[
   {h:"외형", p:[
     "체형: 148cm. 통통하지만 능력을 쓰고 나면 일시적으로 살이 빠짐.",
     "헤어스타일: 언니와 비슷한 백금발이지만, 결이 부드러운 C컬 웨이브 단발. 오른쪽 머리를 살짝 묶은 사이드 포니테일.",
     "눈: 민트색 눈 + 하트 동공. 가운데에 실금이 간 핑크색 하트. 생명력을 깎아 요리를 만들 때마다 금이 벌어짐.",
     "복장: 귀여운 사복 위에 항상 프릴 앞치마를 두르고 다님. 요리하다 다친 상처들 때문에 손가락마다 밴드가 붙어 있음. 품에 낡은 맹꽁이 인형 골골이를 항상 소중하게 안고 다님."
   ]},
   {h:"담당 미덕 & 수호천사", p:[
     "담당 미덕: 자선",
     "수호천사: 자드키엘 — 이명: 박애의 천사",
     "평소 외형: 하얀 맹꽁이 인형 골골이의 껍데기 안에 숨어 있음.",
     "본모습: 머리가 2개에 3쌍의 날개가 달린 하얀 인면조. 하나의 머리는 신의 자비를 찬송하고, 하나의 머리는 따스한 웃음을 지으며 인간과 소통함.",
     "특이사항: 류민트의 수호천사 라미엘과 막역한 친우 사이."
   ]},
   {h:"이능력 — 생명의 만찬", p:[
     "하트 자신의 생명력을 섭취 가능한 형태로 실체화함.",
     "평소 요리 실력은 끔찍하지만, 능력으로 만들어진 요리만은 3스타 미슐랭 저리 가라인 진정한 미식.",
     "자선의 대가: 본인의 생명력을 대가로 치유하는 희생형 힐러. 하트의 눈 속 핑크색 하트에 금이 벌어질수록 생명력이 깎이고 있다는 신호."
   ]},
   {h:"성격", p:[
     "바보같고 추한 것의 가치를 가장 높게 여기는 특이한 가치관의 소유자. 자드키엘의 뜻대로 만인에게 베풀기 위해 웃으며 요리를 대접하는 착하고 가여운 아이."
   ]},
   {h:"관계", p:[
     "【주요】vs 류민트: 언니이자 자신의 가장 든든한 보호자. 민트가 무력으로 위협을 제거하면, 하트는 그 뒤에서 회복을 담당하는 역할 분담이 자연스럽게 이루어짐.",
     "【부가】vs 이난 & 김우주: 언니(민트) 때문에 피해를 입은 두 사람에게 사과의 의미로 직접 만든 요리를 대접하는 것이 하트의 루틴. 능력 미사용 일반 요리라 결과물은 재앙 수준. 이난은 말없이 다 먹고, 우주는 먹은 뒤 이불 속으로 직행함."
   ]}
 ]
},

magnum:{
 name:"매그넘 (Magnum)", sub:"", alias:"가변적 마네킹",
 image:"images/magnum.png", imageLayout:"wide",
 category:"sin", ability:"미러링 (Mirroring)",
 intro:"훔치는 게 촌스럽게 노력하는 것보다 낫다. 그런데도 원본은 복사할 수 없다.",
 basic:[
   ["성별","여성"],["나이","고등학교 2학년 (실제 나이 불명)"],["소속","무소속"],
   ["키워드","질투 / 카피캣 / 멘헤라 / 도파민 중독"],
   ["정체","모범생 마근아의 뒤틀린 분신이자, 인두겁을 쓴 레비아탄 그 자체. 계약자가 따로 있는 것이 아니라, 악마 레비아탄이 직접 인간의 껍데기를 쓰고 현신한 존재. 실제 나이는 인간이 상상 불가능할 정도."]
 ],
 sections:[
   {h:"외형", p:[
     "체형: 160cm. 마근아의 살집 있는 체형까지도 완벽히 카피한 상태.",
     "헤어스타일: 마근아와 같은 녹두색 머리칼이지만, 훨씬 풍성하고 화려한 웨이브 포니테일. 머리에는 노란 별 장식을 주렁주렁 달고 있음.",
     "눈: 마근아와 이목구비는 똑같지만 훨씬 세련된 화장. 검은 X자 모양 동공. 입을 벌리면 날카로운 상어 이빨이 드러남.",
     "안경: 마근아의 뿔테와 달리 화려한 금테 안경.",
     "복장: 아이돌/마법소녀 풍. 흰색 프릴 블라우스 + 레이스 치마 + 녹두색 오버 니삭스 + 리본 구두.",
     "신체 특징: 등에 앙상한 깃털 날개가 돋아 있음. 양쪽 팔뚝에 붕대를 감고 있는데, 잦은 변신 실패와 글리치(오류)로 생긴 흉터를 가리기 위함임."
   ]},
   {h:"담당 죄종 & 본체", p:[
     "담당 죄종: 시기 / 질투",
     "본체: 레비아탄 — 이명: 녹색 눈의 마룡"
   ]},
   {h:"이능력 — 미러링 (Mirroring)", p:[
     "완벽한 변신: 타인의 외형뿐만 아니라 다른 죄종/미덕의 능력까지 복제 가능.",
     "한계: 원본 위력의 약 70% 정도만 발휘할 수 있음.",
     "리스크: 훔쳐낸 대상의 행복의 크기가 클수록 질투심으로 평정을 유지하기 힘들어져 변신이 흔들림."
   ]},
   {h:"성격", p:[
     "하이 텐션 사이코패스. 타인을 일회용 장난감 취급하며, 동료애나 파트너십이 전무함.",
     "도파민 중독자: 끊임없이 자극과 재미를 갈구하며, “재미없어”가 입버릇.",
     "가치관: ”노력? 촌스럽게 왜 그래? 훔치면 되는데.” 남이 소중하게 여기는 것을 망가뜨릴 때 최고의 희열을 느낌."
   ]},
   {h:"관계", p:[
     "【주요】vs 마근아: 악의 가득한 질투와 집착이 뒤섞인 혐오. 마근아의 성실함 자체를 비웃으면서도, 그 성실함을 가장 탐내는 아이러니한 존재. 원본이 존재하는 한 카피는 영원히 카피일 수밖에 없다는 사실이 레비아탄의 가장 깊은 상처.",
     "【부가】vs 카일 타일러: 타인의 능력을 복제하는 매그넘을 카일은 최우선 연구 대상으로 분류 중. 레비아탄의 복제 메커니즘을 해부하면 생명 창조의 실마리가 나올 것이라 보고 있음. 매그넘은 카일의 보건실 반경 50미터 안에 들어가지 않음.",
     "【부가】vs 변아리: 변아리 기준에서 매그넘은 타인의 것을 훔치는 존재 자체가 정신적 오염원. 매그넘이 급식실에 들어오는 순간 가브리엘이 팔을 전개함. 매그넘은 이걸 알면서도 가끔 재미로 들어감.",
     "【부가】vs 세이야 토스케: 레비아탄이 직접 현신한 매그넘은 토스케의 시스템 입장에서 교란 변수. 토스케는 매그넘의 동선을 상시 모니터링하되 직접 개입하지 않음. 매그넘이 시스템 경계를 넘는 순간에만 조용히 접근을 차단함."
   ]}
 ]
},

mint:{
 name:"류민트", sub:"", alias:"친절의 탈을 쓴 민폐",

    '</div></div>';
  app.innerHTML = html;

  function draw(q){
    q = (q||"").trim().toLowerCase();
    var grid = document.getElementById("charGrid");
    var list = ids.filter(function(id){ return !q || CHARS[id].name.toLowerCase().indexOf(q) !== -1; });
    grid.innerHTML = list.map(function(id){
      var c = CHARS[id];
      var affil = c.basic.filter(function(b){return b[0]==="소속";})[0];
      var age = c.basic.filter(function(b){return b[0]==="나이";})[0];
      return '<div class="char-card">'+
        '<div class="cc-top"><span class="cc-affil">'+(affil?affil[1]:"")+'</span><span class="cc-age">'+(age?age[1]:"")+'</span></div>'+
        '<div class="cc-name">'+c.name.replace(/\s*\(.*?\)\s*$/,"")+'</div>'+
        '<div class="cc-alias">'+(c.alias||"")+'</div>'+
        '<div class="cc-ability"><b>'+c.ability+'</b></div>'+
        '<div class="cc-intro">'+c.intro+'</div>'+
        '<a class="cc-link" href="#character/detail/'+id+'">상세 프로필</a>'+
        '</div>';
    }).join("");
    document.getElementById("charEmpty").classList.toggle("show", list.length===0);
  }
  draw("");
  document.getElementById("charSearch").addEventListener("input", function(e){ draw(e.target.value); });
}

function renderDetail(id){
  var c = CHARS[id];
  if(!c){ renderCharacterLanding(); return; }
  setActiveMainNav("character");
  subNav.hidden = !c.category;

  var backHref = c.category ? "#character/"+c.category : "#character";
  var html = '<div class="page">'+
    '<div class="page-body">'+
    '<div class="detail-top">'+
      '<a class="detail-back" href="'+backHref+'">목록으로</a>'+

    '</div>';

  var headHtml = '<div class="detail-head">'+
      '<div class="detail-affil">'+(c.category ? CAT_LABEL[c.category] : "")+'</div>'+
      '<h1 class="detail-name">'+c.name+'</h1>'+
      (c.alias ? '<div class="detail-alias">'+c.alias+'</div>' : '')+
      (c.sub ? '<div class="detail-sub">'+c.sub+'</div>' : '')+
    '</div>';

  var basicHtml = '<div class="detail-basic">';
  c.basic.forEach(function(b){
    if(b[0]===""){
      basicHtml += '<div class="row"><span style="padding:10px 14px;">'+b[1]+'</span></div>';
    } else {
      basicHtml += '<div class="row"><b>'+b[0]+'</b><span>'+b[1]+'</span></div>';
    }
  });
  basicHtml += '</div>';

  var imgScaleStyle = ' style="--img-scale:'+(c.imageScale || 1)+'"';

  if(c.image && c.imageLayout === "wide"){
    html += headHtml;
    html += '<div class="detail-image-wide"><img src="'+c.image+'" alt="'+c.name+'" loading="lazy"'+imgScaleStyle+'></div>';
    html += basicHtml;
  } else if(c.image){
    html += '<div class="detail-hero">'+
      headHtml+
      '<div class="detail-hero-image"><img src="'+c.image+'" alt="'+c.name+'" loading="lazy"'+imgScaleStyle+'></div>'+
      basicHtml+
    '</div>';
  } else {
    html += headHtml + basicHtml;
  }

  c.sections.forEach(function(s){
    html += '<div class="detail-section"><h4>'+s.h+'</h4>';
    s.p.forEach(function(p){ html += '<p>'+p+'</p>'; });
    html += '</div>';
  });

  if(c.related && c.related.length){
    html += '<div class="detail-section"><h4>관련 프로필</h4><p class="detail-related">';
    html += c.related.map(function(r){ return '<a href="#character/detail/'+r[0]+'">'+r[1]+' →</a>'; }).join(' &nbsp;&nbsp; ');
    html += '</p></div>';
  }

  html += '</div></div>';
  app.innerHTML = html;
  window.scrollTo(0,0);
}

  if(parts.length === 0 || parts[0] === "main"){ renderMain(); return; }
  if(parts[0] === "universe"){ renderUniverse(); return; }
  if(parts[0] === "terms"){ renderTerms(); return; }
  if(parts[0] === "character"){
    if(parts.length === 1){ renderCharacterLanding(); return; }
    if(parts[1] === "detail" && parts[2]){ renderDetail(parts[2]); return; }
    if(CAT_ORDER.indexOf(parts[1]) !== -1){ renderCharacterCategory(parts[1]); return; }
    renderCharacterLanding(); return;
  }
  renderMain();
}

var mainNavBar = document.getElementById("mainNavBar");
var menuToggle = document.getElementById("menuToggle");
menuToggle.addEventListener("click", function(){
  var isOpen = mainNavBar.classList.toggle("open");
  menuToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
});
mainNav.querySelectorAll("a").forEach(function(a){
  a.addEventListener("click", function(){
    mainNavBar.classList.remove("open");
    menuToggle.setAttribute("aria-expanded", "false");
  });
});

window.addEventListener("hashchange", route);
route();

})();
</script>
</body>
</html>
